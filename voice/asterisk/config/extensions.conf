; The SIP user part is the room (= conversation id). Hand every call to the
; voice-control service via ARI, with the user Kamailio authenticated.
[general]
static = yes
writeprotect = yes

[parley]
; Room ids are UUIDs: start with a hex digit, then anything.
exten => _[0-9a-f].,1,Stasis(parley,${EXTEN},${PJSIP_HEADER(read,X-Parley-User)})
 same => n,Hangup()
; Keep the special extensions inert.
exten => h,1,NoOp()
exten => i,1,Hangup()
exten => t,1,Hangup()
