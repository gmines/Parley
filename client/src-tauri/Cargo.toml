[package]
name = "parley-client"
version = "0.9.0"
description = "Parley desktop client: text and voice chat"
authors = ["Parley contributors"]
license = "GPL-2.0-only"
edition = "2021"
rust-version = "1.80"
default-run = "parley-client"

# Test tool, not part of the app: cargo build --features voiceprobe --bin voiceprobe
[[bin]]
name = "voiceprobe"
path = "src/bin/voiceprobe.rs"
required-features = ["voiceprobe"]

[features]
voiceprobe = []

[lib]
name = "parley_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", features = ["json"] }
tokio = { version = "1", features = ["sync", "time"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock", "std"] }
url = "2"
log = "0.4"
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"

# Idle time and screen lock over D-Bus (idle.rs); already used by keyring.
[target.'cfg(target_os = "linux")'.dependencies]
dbus = "0.9"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
