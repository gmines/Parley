[package]
name = "parley-client"
version = "0.2.1"
description = "Parley desktop client: text and voice chat"
authors = ["Parley contributors"]
edition = "2021"
rust-version = "1.80"

[lib]
name = "parley_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", features = ["json"] }
tokio = { version = "1", features = ["sync", "time"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock", "std"] }
url = "2"
log = "0.4"
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
