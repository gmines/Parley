# Builds the Parley desktop installers on each OS's own runner:
#   Linux   .deb, .rpm, .AppImage
#   Windows setup .exe (NSIS) and .msi
#   macOS   universal .dmg / .app (Apple Silicon + Intel)
#
# Push a tag like `client-v0.1.0` to build and attach the installers to a
# *draft* GitHub release (publish it by hand after checking it). Run the
# workflow manually ("Run workflow") to just build and download the
# installers from the run's artifacts.
#
# Code signing is not configured yet, so Windows SmartScreen and macOS
# Gatekeeper will warn on first launch. See the commented env blocks below.
name: client-release

on:
  push:
    tags: ["client-v*"]
  workflow_dispatch:

permissions:
  contents: write # create the draft release

jobs:
  test:
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: parley
          POSTGRES_DB: parley
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Go tests
        env:
          PARLEY_TEST_DATABASE_URL: postgres://postgres:parley@localhost:5432/parley?sslmode=disable
        run: |
          test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
          go vet ./...
          go test -race ./...
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libdbus-1-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Client checks
        working-directory: client
        run: |
          npm ci
          npx tsc --noEmit
          npm run build
          cd src-tauri
          cargo clippy --all-targets -- -D warnings
          cargo test

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04 # oldest supported glibc, so packages run on newer distros
            args: ""
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libdbus-1-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client/src-tauri
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Install npm dependencies
        working-directory: client
        run: npm ci

      - uses: tauri-apps/tauri-action@v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS signing + notarization (needs an Apple Developer account).
          # Add these repository secrets, then uncomment:
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: client
          args: ${{ matrix.args }}
          uploadWorkflowArtifacts: true
          # Only tag pushes create a (draft) release; manual runs just upload artifacts.
          tagName: ${{ startsWith(github.ref, 'refs/tags/client-v') && github.ref_name || '' }}
          releaseName: "Parley ${{ github.ref_name }}"
          releaseBody: "Desktop installers for Windows, macOS and Linux. Draft: check the downloads before publishing."
          releaseDraft: true
          prerelease: true
