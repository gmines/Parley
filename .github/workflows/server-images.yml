# Server container images for the Helm chart (deploy/helm/parley), pushed to
# ghcr.io/<owner>/parley-<name>:
#   - every push to development/main: :<branch> and :sha-<commit>
#   - tags server-vX.Y.Z: :X.Y.Z (what the chart's appVersion points at)
name: server-images

on:
  push:
    branches: [development, main]
    tags: ["server-v*"]
    paths:
      - "services/**"
      - "pkg/**"
      - "go.mod"
      - "go.sum"
      - "voice/kamailio/**"
      - "voice/freeswitch/**"
      - "deploy/helm/**"
      - ".github/workflows/server-images.yml"
  pull_request:
    paths:
      - "deploy/helm/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write # push to ghcr.io

jobs:
  chart:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5.0.1
      - name: Lint and render the chart
        run: |
          helm lint deploy/helm/parley -f deploy/helm/parley/ci-values.yaml
          helm template parley deploy/helm/parley -f deploy/helm/parley/ci-values.yaml > /dev/null
          # External database and NATS instead of the bundled ones.
          helm template parley deploy/helm/parley -f deploy/helm/parley/ci-values.yaml \
            --set postgres.enabled=false --set externalDatabase.existingSecret=pg \
            --set nats.enabled=false --set externalNats.url=nats://nats.example:4222 > /dev/null

  image:
    if: github.event_name != 'pull_request'
    needs: chart
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: .
            file: services/api/Dockerfile
          - name: realtime
            context: .
            file: services/realtime/Dockerfile
          - name: voice-control
            context: .
            file: services/voice-control/Dockerfile
          - name: kamailio
            context: voice/kamailio
            file: voice/kamailio/Containerfile
          - name: freeswitch
            context: voice/freeswitch
            file: voice/freeswitch/Containerfile
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/parley-${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=sha
            type=match,pattern=server-v(.*),group=1
      - uses: docker/build-push-action@v7.4.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          # FreeSWITCH builds from source (~15 min): reuse unchanged layers.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
