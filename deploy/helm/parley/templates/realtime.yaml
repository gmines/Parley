{{- $name := printf "%s-realtime" (include "parley.name" .) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "parley.labels" . | nindent 4 }}
    {{- include "parley.selector" (list . "realtime") | nindent 4 }}
spec:
  replicas: {{ .Values.realtime.replicas }}
  selector:
    matchLabels:
      {{- include "parley.selector" (list . "realtime") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "parley.labels" . | nindent 8 }}
        {{- include "parley.selector" (list . "realtime") | nindent 8 }}
      annotations:
        # Restart on secret changes. Only what values supply: generated secrets
        # never change once created.
        checksum/secrets: {{ toJson (list .Values.secrets .Values.postgres.password) | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "parley.podSecurity" . | nindent 8 }}
      # WebSocket clients reconnect on their own; give them time to be told.
      terminationGracePeriodSeconds: 15
      containers:
        - name: realtime
          image: {{ include "parley.image" (list . "realtime") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: PARLEY_LISTEN_ADDR
              value: ":8081"
            - name: PARLEY_NATS_URL
              value: {{ include "parley.natsUrl" . | quote }}
            - name: PARLEY_VERIFY_KEY
              valueFrom:
                secretKeyRef: { name: {{ include "parley.secretName" . }}, key: verify-key }
          ports:
            - { name: http, containerPort: 8081 }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          resources:
            {{- toYaml .Values.realtime.resources | nindent 12 }}
          securityContext:
            {{- include "parley.containerSecurity" . | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "parley.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "parley.selector" (list . "realtime") | nindent 4 }}
  ports:
    - { name: http, port: 8081, targetPort: http }
