{{- $name := printf "%s-api" (include "parley.name" .) }}
{{- if and (not .Values.postgres.enabled) (not .Values.externalDatabase.existingSecret) (not .Values.secrets.existingSecret) }}
{{- fail "postgres.enabled=false needs externalDatabase.existingSecret (or a database-url key in secrets.existingSecret)" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "parley.labels" . | nindent 4 }}
    {{- include "parley.selector" (list . "api") | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "parley.selector" (list . "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "parley.labels" . | nindent 8 }}
        {{- include "parley.selector" (list . "api") | nindent 8 }}
      annotations:
        # Restart on secret changes. Only what values supply: generated secrets
        # never change once created.
        checksum/secrets: {{ toJson (list .Values.secrets .Values.postgres.password) | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "parley.podSecurity" . | nindent 8 }}
      containers:
        - name: api
          image: {{ include "parley.image" (list . "api") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: PARLEY_LISTEN_ADDR
              value: ":8080"
            - name: PARLEY_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  {{- include "parley.databaseUrlRef" . | nindent 18 }}
            - name: PARLEY_SIGNING_KEY
              valueFrom:
                secretKeyRef: { name: {{ include "parley.secretName" . }}, key: signing-key }
            - name: PARLEY_NATS_URL
              value: {{ include "parley.natsUrl" . | quote }}
            - name: PARLEY_ACCESS_TTL
              value: {{ .Values.api.accessTTL | quote }}
            - name: PARLEY_REFRESH_TTL
              value: {{ .Values.api.refreshTTL | quote }}
            - name: PARLEY_TRUSTED_PROXIES
              value: {{ .Values.api.trustedProxies | quote }}
            # One hostname for everything: realtime and voice-control are
            # routed by path on the same ingress.
            - name: PARLEY_REALTIME_PUBLIC_URL
              value: {{ printf "%s://%s/v1/realtime" (include "parley.wsScheme" .) (required "host is required" .Values.host) | quote }}
            {{- range $k, $v := .Values.api.extraEnv }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            {{- include "parley.containerSecurity" . | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "parley.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "parley.selector" (list . "api") | nindent 4 }}
  ports:
    - { name: http, port: 8080, targetPort: http }
