{{- if not .Values.secrets.existingSecret }}
{{- /* Generated values are read back from the live Secret so upgrades keep them. */}}
{{- $name := include "parley.secretName" . }}
{{- $live := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
{{- $keep := dict }}
{{- range $k, $v := $live }}{{ $_ := set $keep $k ($v | b64dec) }}{{ end }}
{{- $sip := .Values.secrets.sipSecret | default (get $keep "sip-secret") | default (randAlphaNum 40) }}
{{- $esl := .Values.secrets.eslPassword | default (get $keep "esl-password") | default (randAlphaNum 32) }}
{{- if regexMatch "[^A-Za-z0-9_-]" $esl }}{{ fail "secrets.eslPassword may only contain letters, digits, '_' and '-'" }}{{ end }}
{{- if regexMatch "[\"\\\\]" $sip }}{{ fail "secrets.sipSecret must not contain quotes or backslashes" }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "parley.labels" . | nindent 4 }}
type: Opaque
stringData:
  signing-key: {{ required "secrets.signingKey is required (generate a pair with: podman run --rm ghcr.io/gmines/parley-api keygen)" .Values.secrets.signingKey | quote }}
  verify-key: {{ required "secrets.verifyKey is required (printed by keygen with the signing key)" .Values.secrets.verifyKey | quote }}
  sip-secret: {{ $sip | quote }}
  esl-password: {{ $esl | quote }}
  {{- if .Values.postgres.enabled }}
  {{- $pw := .Values.postgres.password | default (get $keep "postgres-password") | default (randAlphaNum 32) }}
  postgres-password: {{ $pw | quote }}
  database-url: {{ printf "postgres://%s:%s@%s-postgres:5432/%s?sslmode=disable" .Values.postgres.username $pw (include "parley.name" .) .Values.postgres.database | quote }}
  {{- end }}
{{- end }}
